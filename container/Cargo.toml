[dev-dependencies]
# Real encoded samples at test time: hardware H.264/H.265 where the host has
# them, software AV1 everywhere.
mediax-codec = { workspace = true, features = ["software-encode"] }
hex.workspace = true
tempfile = "3"

[lints]
workspace = true
