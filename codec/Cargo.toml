[package]
name = "mediax-codec"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Hardware-aware video codec with deterministic timing and wgpu texture output"
keywords = ["codec", "video", "gpu", "h264", "av1"]
categories = ["multimedia::video", "graphics"]

[dependencies]
# `rav1d` reports EAGAIN as the platform's `libc::EAGAIN`; matching on it needs
# the same constant, and its value differs across platforms (11 / 35).
libc = "0.2"
thiserror.workspace = true
image.workspace = true
half = "2"
mediax-core.workspace = true
tracing.workspace = true

# GPU texture output. Optional so a decode-only consumer that just wants pixels
# links neither wgpu nor the shader toolchain.
wgpu = { workspace = true, optional = true }
shaderloom = { workspace = true, features = ["runtime"], optional = true }

[build-dependencies]
cfg_aliases = "0.2"
shaderloom = { workspace = true, features = ["build"], optional = true }
mediax-core.workspace = true

# Software fallback codecs (private, not exposed in public API)
# Only enabled on desktop platforms - mobile and wasm use their native decode paths
[target.'cfg(not(any(target_os = "ios", target_os = "android", target_arch = "wasm32")))'.dependencies]
rav1e = { workspace = true, optional = true }
rav1d = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
avif-parse = { version = "2.1", optional = true }
yuv = { version = "0.8.19", optional = true }
moxcms = { version = "0.9.1", features = ["extended_range"], optional = true }

# Pure-Rust AAC-LC decoding for the targets without a platform AAC decoder
# (Apple decodes through AudioToolbox, Android through MediaCodec, Windows
# through Media Foundation).
[target.'cfg(not(any(target_vendor = "apple", target_os = "android", target_os = "windows")))'.dependencies]
symphonia-core = { workspace = true, optional = true }
symphonia-codec-aac = { workspace = true, optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2.workspace = true
objc2-video-toolbox.workspace = true
objc2-audio-toolbox = { workspace = true, features = ["AudioConverter", "objc2-core-audio-types"] }
objc2-core-audio-types.workspace = true
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSData",
    "NSDictionary",
    "NSObject",
    "NSString",
] }
objc2-io-surface.workspace = true
objc2-core-graphics = { workspace = true, features = ["CGColorSpace", "objc2"] }
objc2-core-image = { workspace = true, features = [
    "CIContext",
    "CIImage",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-image-io = { workspace = true, features = [
    "CGImageSource",
    "objc2-core-graphics",
] }

# Metal interop for the GPU texture-output path only.
objc2-metal = { workspace = true, features = ["MTLBlitCommandEncoder", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice", "MTLPixelFormat", "MTLTexture", "MTLTypes"], optional = true }
wgpu-hal = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# `bitmap` wraps `AndroidBitmap_lockPixels`; `api-level-30` only gates the Rust
# `BitmapInfo::flags` accessor (no API-30-only NDK call is made — the alpha
# flags are read only when `Build$VERSION.SDK_INT >= 30` at runtime).
ndk = { version = "0.9", features = ["media", "bitmap", "api-level-29", "api-level-30"] }
ndk-sys = "0.6"
jni.workspace = true
ndk-context.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Media_MediaFoundation", "Win32_System_Com"] }

# The software AV1 decoder's end-to-end test builds its input with `image`'s
# AVIF *encoder*. Nothing else in the workspace encodes AVIF, so that encoder
# (ravif -> rav1e) is asked for here instead of in the shared workspace entry.
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dev-dependencies]
image = { workspace = true, features = ["avif"] }

# The AudioToolbox AAC decoder's tests compare it against the pure-Rust decoder.
[target.'cfg(target_vendor = "apple")'.dev-dependencies]
symphonia-core.workspace = true
symphonia-codec-aac.workspace = true

[dev-dependencies]
pollster.workspace = true
hex.workspace = true

[features]
default = ["gpu", "software-encode"]
# Packet-oriented AAC decoding (`audio`): AudioToolbox on Apple, MediaCodec on
# Android, Media Foundation on Windows, a pure-Rust AAC-LC decoder elsewhere.
aac = ["dep:symphonia-core", "dep:symphonia-codec-aac"]
# Uploads decoded frames to `wgpu` textures and converts them to linear RGBA on
# the GPU. Off, the crate decodes to CPU memory only and links no `wgpu`.
gpu = [
    "dep:wgpu",
    "dep:wgpu-hal",
    "dep:shaderloom",
    "dep:objc2-metal",
    "objc2-core-video/CVMetalTexture",
    "objc2-core-video/CVMetalTextureCache",
]
# AV1 *decode* in software: rav1d + the AVIF still-image path (avif-parse,
# yuv, moxcms). Consumers that never encode pick this and skip `rav1e`.
software-decode = ["dep:rav1d", "dep:avif-parse", "dep:yuv", "dep:moxcms"]
# AV1 *encode* in software adds `rav1e` on top of the decode stack.
software-encode = ["dep:rav1e", "dep:num-traits", "software-decode"]

[lints]
workspace = true
