name: Release preflight

# Guards the one failure this repository cannot undo: publishing a version
# whose number already exists on crates.io while its contents have moved on.
# crates.io versions are immutable, so a missed bump ships a crate that no
# longer matches what consumers compile against.
#
# release-plz already runs this check when it prepares a release PR. This job
# is the second line: it still guards a release when release-pr did not run.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semver:
    name: Local API vs published baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # The check builds rustdoc for both sides of the comparison, which
      # compiles the whole workspace: without these it dies in `khronos-egl`'s
      # build script looking for `egl.pc`, and reports a red preflight that
      # says nothing about the API.
      - uses: ./.github/actions/setup-linux-deps
      - uses: obi1kenobi/cargo-semver-checks-action@v2
