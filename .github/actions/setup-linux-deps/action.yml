name: Setup Linux native dependencies
description: >
  Installs the native tools and libraries a Linux build of this workspace
  needs: EGL development files, which `khronos-egl` (via `wgpu-hal`) locates
  through pkg-config, and nasm for rav1e's x86_64 SIMD kernels. Every Linux
  job needs the same list, so it lives here once.
runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      shell: bash
      run: |
        sudo apt-get -c "$GITHUB_WORKSPACE/.github/apt.conf" update
        sudo apt-get -c "$GITHUB_WORKSPACE/.github/apt.conf" install -y \
          libegl-dev \
          nasm
