# release-plz configuration
# https://release-plz.ieni.dev/docs/config

[workspace]
publish_timeout = "30m"
allow_dirty = false
git_release_enable = true
git_tag_enable = true

# The command-line binary is built by the `dist.yml` workflow, which runs on
# this tag and creates the GitHub release with the binaries attached.
[[package]]
name = "mediax-cli"
git_tag_name = "cli/v{{ version }}"
git_release_enable = false

# The benchmark binary is not published.
[[package]]
name = "mediax-bench"
release = false

# `mediax-processing`'s `filtrate` feature builds through a `[patch.crates-io]`
# git pin that crates.io drops, and the semver check builds every feature from a
# copy outside the workspace, where that pin does not apply. The crate stays
# unreleased until a filtrate release carries the executor API.
[[package]]
name = "mediax-processing"
release = false

# The facade depends on `mediax-processing = "^0.1.0"`, which is still at its
# 0.0.0 placeholder on crates.io for the reason above; keep the facade
# unreleased alongside it until `mediax-processing` can be published.
[[package]]
name = "mediax"
release = false
